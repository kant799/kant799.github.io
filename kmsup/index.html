<style>
  * { box-sizing: border-box; }

  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

  .video-row {
    cursor: pointer; transition: all 0.15s;
    border-left: 3px solid transparent;
  }

  .video-row.active { background: #eff6ff; border-left-color: #3b82f6; }
  .video-row.done { border-left-color: #22c55e; }
  .video-row.done.active { background: #eff6ff; border-left-color: #3b82f6; }

  .opt-btn {
    cursor: pointer; transition: all 0.15s;
    border: 1.5px solid #e5e7eb; border-radius: 10px;
    padding: 8px 12px; background: white;
  }
  .opt-btn:hover { border-color: #93c5fd; background: #eff6ff; }
  .opt-btn.selected {
    border-color: #3b82f6; background: #eff6ff;
    box-shadow: 0 0 0 1px #3b82f6;
  }
  .opt-btn.selected .opt-num { background: #3b82f6; color: white; }

  .toast {
    animation: toast-in 0.3s ease-out, toast-out 0.3s ease-in 2s forwards;
  }
  @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toast-out { from { opacity: 1; } to { opacity: 0; } }

  /* 表格视图 */

  .data-table th, .data-table td {
    border: 1px solid #e5e7eb; padding: 3px 6px;

  .data-table th {

</style>

const CATEGORIES = [];
CATEGORY_GROUPS.forEach(g => g.items.forEach(item => CATEGORIES.push(item)));
const CODE_COLS = ['1.1','1.2','2.1','2.2','2.3','3.1','3.2','3.3','3.4'];
const STAT_COLS = ['save','cmt','like','play','share'];

// ============================================================
// 全局状态
// ============================================================

let csvData = [];
let csvHeaders = [];
let currentIdx = -1;
const manualSelections = {};

// ============================================================
// DOM
// ============================================================

const emptyState       = $('emptyState');

const listProgress     = $('listProgress');
const searchInput      = $('searchInput');
const statsBar         = $('statsBar');

const currentVideoLink = $('currentVideoLink');
const playerEmpty      = $('playerEmpty');
const playerContainer  = $('playerContainer');
const tiktokPlayer     = $('tiktokPlayer');
const iframeFallback   = $('iframeFallback');
const fallbackLink     = $('fallbackLink');
const manualForm       = $('manualForm');
const progressCells    = $('progressCells');
const progressCount    = $('progressCount');
const clearManualBtn   = $('clearManualBtn');
const saveAndNextBtn   = $('saveAndNextBtn');
const exportCsvBtn     = $('exportCsvBtn');
const tableHeader      = $('tableHeader');
const tableRow         = $('tableRow');

// ============================================================
// CSV 解析
// ============================================================
function extractVideoId(url) {
  const m = url.match(/\/video\/(\d+)/);
  return m ? m[1] : null;
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === ',' && !inQuotes) { result.push(current); current = ''; }
    else { current += ch; }
  }
  result.push(current);
  return result;
}

function parseCSV(text) {
  const lines = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      if (current.trim()) lines.push(current);
      current = ''; inQuotes = false;
    } else { current += ch; }
  }
  if (current.trim()) lines.push(current);

  if (lines.length < 2) throw new Error('CSV 文件至少需要标题行和一行数据');

  const headers = parseCSVLine(lines[0]);
  const colMap = {};
  headers.forEach((h, i) => { colMap[h.trim()] = i; });
  const urlCol = colMap['视频ID'] ?? colMap['视频id'] ?? colMap['video_id'] ?? 0;

  const data = [];
  for (let i = 1; i < lines.length; i++) {
    const fields = parseCSVLine(lines[i]);
    const url = (fields[urlCol] || '').trim();
    if (!url) continue;

    const codes = {};
    CODE_COLS.forEach(col => {
      const idx = colMap[col];
      if (idx !== undefined && fields[idx] !== undefined && fields[idx].trim() !== '') {
        codes[col] = parseInt(fields[idx].trim(), 10);
      }
    });

    const stats = {};
    STAT_COLS.forEach(col => {
      const idx = colMap[col];
      if (idx !== undefined && fields[idx] !== undefined) {
        stats[col] = fields[idx].trim();
      }
    });

    data.push({ url, codes, stats, fields });
  }
  return { headers, data };
}

// ============================================================
// CSV 导入 / 导出
// ============================================================
function handleCSVImport(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const { headers, data } = parseCSV(e.target.result);
      csvData = data;
      csvHeaders = headers;
      currentIdx = -1;
      showToast(`成功导入 ${data.length} 条视频记录`, 'success');
      emptyState.classList.add('hidden');
      mainLayout.classList.remove('hidden');
      exportCsvBtn.disabled = false;
      renderVideoList();
      updateStatsBar();
      if (data.length > 0) selectVideo(0);
    } catch (err) {
      showToast('CSV 解析失败: ' + err.message, 'error');
    }
  };
  reader.readAsText(file, 'UTF-8');
}

function exportCSV() {
  if (csvData.length === 0) return;
  const lines = [csvHeaders.join(',')];
  csvData.forEach(row => {
    const fields = [...(row.fields || [])];
    CODE_COLS.forEach(col => {
      const idx = csvHeaders.indexOf(col);
      if (idx !== -1) fields[idx] = row.codes[col] !== undefined ? String(row.codes[col]) : '';
    });
    lines.push(fields.join(','));
  });
  const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `标注结果_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast('CSV 已导出', 'success');
}

// 表格视图

    `<th>${col}</th>`

  ).join('');

  // 数据行
  let cells = CODE_COLS.map(col => {
    const val = row.codes[col];
    if (val !== undefined) {
      return `<td class="filled">${val}</td>`;
    }
    return `<td class="empty">-</td>`;
  }).join('');

  cells += STAT_COLS.map(col => {
    return `<td style="color:#94a3b8">${row.stats[col] || '0'}</td>`;
  }).join('');

  tableRow.innerHTML = cells;
}

// ============================================================
// 视频列表
// ============================================================
function renderVideoList(filter = '') {
  videoList.innerHTML = '';
  const lower = filter.toLowerCase();

  csvData.forEach((row, idx) => {
    const vid = extractVideoId(row.url) || '';
    if (lower && !vid.includes(lower) && !row.url.toLowerCase().includes(lower)) return;

    const isDone = CODE_COLS.every(col => row.codes[col] !== undefined);
    const isActive = idx === currentIdx;

    const div = document.createElement('div');
    div.className = `video-row px-3 py-2 border-b border-gray-50 ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}`;
    div.dataset.idx = idx;
    div.innerHTML = `
      <div class="flex items-center gap-2">
        <span class="w-5 h-5 rounded-full flex items-center justify-center shrink-0 text-[10px] font-medium ${isDone ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-400'}">
          ${isDone ? '✓' : idx + 1}
        </span>
        <div class="min-w-0 flex-1">
          <div class="text-[11px] text-gray-600 truncate font-mono">${vid}</div>
          <div class="text-[10px] text-gray-400 mt-0.5">
            ${row.stats.play ? '▶ ' + Number(row.stats.play).toLocaleString() : ''}
            ${row.stats.like ? ' ♥ ' + Number(row.stats.like).toLocaleString() : ''}
          </div>
        </div>
      </div>`;
    div.addEventListener('click', () => selectVideo(idx));
    videoList.appendChild(div);
  });

  const doneCount = csvData.filter(r => CODE_COLS.every(col => r.codes[col] !== undefined)).length;
  listProgress.textContent = `${doneCount}/${csvData.length}`;
}

function updateStatsBar() {
  const done = csvData.filter(r => CODE_COLS.every(col => r.codes[col] !== undefined)).length;
  statsBar.textContent = `共 ${csvData.length} 条 · 已标注 ${done} 条`;
}

// ============================================================
// 选择视频
// ============================================================
function selectVideo(idx) {
  if (currentIdx >= 0) saveCurrentAnnotations();

  currentIdx = idx;
  const row = csvData[idx];
  const vid = extractVideoId(row.url) || '';

  // 列表高亮
  videoList.querySelectorAll('.video-row').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === idx);
  });
  const activeRow = videoList.querySelector(`.video-row[data-idx="${idx}"]`);
  if (activeRow) activeRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

  // 顶栏
  currentVideoIdx.textContent = `#${idx + 1}`;
  currentVideoLink.href = row.url;
  currentVideoLink.textContent = row.url;

  // 播放器
  if (vid) {
    playerEmpty.classList.add('hidden');
    playerContainer.classList.remove('hidden');
    iframeFallback.classList.add('hidden');
    tiktokPlayer.src = `https://www.tiktok.com/embed/v2/${vid}`;
    let loaded = false;
    tiktokPlayer.onload = () => { loaded = true; };
    setTimeout(() => {
      if (!loaded) {
        iframeFallback.classList.remove('hidden');
        fallbackLink.href = row.url;
      }
    }, 8000);
  }

  // 表格视图
  renderTableView();

  // 加载标注
  loadAnnotations(row);
}

// ============================================================
// 标注：加载 / 保存
// ============================================================
function loadAnnotations(row) {
  Object.keys(manualSelections).forEach(k => delete manualSelections[k]);
  manualForm.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));

  CODE_COLS.forEach(col => {
    if (row.codes[col] !== undefined) manualSelections[col] = row.codes[col];
  });

  Object.entries(manualSelections).forEach(([key, val]) => {
    const btn = manualForm.querySelector(`.opt-btn[data-key="${key}"][data-value="${val}"]`);
    if (btn) btn.classList.add('selected');
  });

  updateProgress();
}

function saveCurrentAnnotations() {
  if (currentIdx < 0) return;
  const row = csvData[currentIdx];
  CODE_COLS.forEach(col => {
    if (manualSelections[col] !== undefined) row.codes[col] = manualSelections[col];
  });
  renderVideoList(searchInput.value.trim());
  updateStatsBar();
  renderTableView();
}

// ============================================================
// 标注表单
// ============================================================
function renderManualForm() {
  manualForm.innerHTML = '';
  CATEGORY_GROUPS.forEach(group => {
    const section = document.createElement('div');
    section.className = 'bg-white rounded-xl shadow-sm border border-gray-200 p-4';
    section.innerHTML = `<h3 class="text-xs font-semibold text-gray-800 mb-3">${group.group}</h3>`;

    group.items.forEach(cat => {
      const catDiv = document.createElement('div');
      catDiv.className = 'mb-4 last:mb-0';
      catDiv.innerHTML = `<div class="flex items-center gap-2 mb-2">
        <span class="text-[10px] font-mono bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded">${cat.key}</span>
        <span class="text-xs font-medium text-gray-700">${cat.name}</span>
      </div>`;

      const btnGrid = document.createElement('div');
      btnGrid.className = 'grid gap-1.5 ' + (cat.options.length <= 4 ? 'grid-cols-2' : 'grid-cols-2 md:grid-cols-3');

      cat.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'opt-btn text-left';
        btn.dataset.key = cat.key;
        btn.dataset.value = opt.value;
        btn.innerHTML = `
          <div class="flex items-start gap-2">
            <span class="opt-num inline-flex items-center justify-center w-5 h-5 rounded-md bg-gray-100 text-[10px] font-bold text-gray-500 shrink-0 mt-0.5">${opt.value}</span>
            <div class="min-w-0">
              <div class="text-xs font-medium text-gray-800">${opt.label}</div>
              <div class="text-[10px] text-gray-400 mt-0.5 leading-relaxed">${opt.desc}</div>
            </div>
          </div>`;
        btn.addEventListener('click', () => {
          btnGrid.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          manualSelections[cat.key] = opt.value;
          updateProgress();
        });
        btnGrid.appendChild(btn);
      });

      catDiv.appendChild(btnGrid);
      section.appendChild(catDiv);
    });
    manualForm.appendChild(section);
  });
}

function updateProgress() {
  const total = CATEGORIES.length;
  const done = Object.keys(manualSelections).length;
  progressCount.textContent = `${done}/${total}`;
  saveAndNextBtn.disabled = done < total;

  progressCells.innerHTML = CATEGORIES.map(cat => {
    const val = manualSelections[cat.key];
    const filled = val !== undefined;
    return `<div class="flex-1 h-1.5 rounded-full transition-colors duration-200 ${filled ? 'bg-blue-500' : 'bg-gray-200'}"
                title="${cat.key} ${cat.name}${filled ? ' = ' + val : '（未选）'}"></div>`;
  }).join('');

  // 同步更新表格视图
  if (currentIdx >= 0) {
    const row = csvData[currentIdx];
    // 临时合并 manualSelections 到 row 用于渲染
    const mergedCodes = { ...row.codes, ...manualSelections };
    CODE_COLS.forEach((col, i) => {
      const td = tableRow.children[i];
      if (!td) return;
      const val = mergedCodes[col];
      if (val !== undefined) {
        td.className = 'filled';
        td.textContent = val;
      } else {
        td.className = 'empty';
        td.textContent = '-';
      }
    });
  }
}

// ============================================================
// 操作按钮
// ============================================================
clearManualBtn.addEventListener('click', () => {
  Object.keys(manualSelections).forEach(k => delete manualSelections[k]);
  manualForm.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  updateProgress();
  showToast('已清空当前选择', 'info');
});

saveAndNextBtn.addEventListener('click', () => {
  const total = CATEGORIES.length;
  const done = Object.keys(manualSelections).length;
  if (done < total) {
    const missing = CATEGORIES.filter(c => !manualSelections[c.key]).map(c => c.key);
    showToast(`还有 ${total - done} 项未选择：${missing.join('、')}`, 'error');
    return;
  }
  saveCurrentAnnotations();
  showToast('已保存', 'success');
  const nextIdx = findNextUnannotated(currentIdx + 1);
  if (nextIdx >= 0) {
    selectVideo(nextIdx);
  } else {
    showToast('全部标注完成！', 'success');
  }
});

function findNextUnannotated(startIdx) {
  for (let i = startIdx; i < csvData.length; i++) {
    if (!CODE_COLS.every(col => csvData[i].codes[col] !== undefined)) return i;
  }
  for (let i = 0; i < startIdx; i++) {
    if (!CODE_COLS.every(col => csvData[i].codes[col] !== undefined)) return i;
  }
  return -1;
}

// ============================================================
// 键盘快捷键
// ============================================================
document.addEventListener('keydown', (e) => {
  if (mainLayout.classList.contains('hidden')) return;
  if (e.key === 'ArrowUp' && currentIdx > 0) {
    e.preventDefault(); selectVideo(currentIdx - 1);
  }
  if (e.key === 'ArrowDown' && currentIdx < csvData.length - 1) {
    e.preventDefault(); selectVideo(currentIdx + 1);
  }
  if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey &&
      document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    e.preventDefault(); saveAndNextBtn.click();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveCurrentAnnotations();
    showToast('已保存当前标注', 'success');
  }
});

// ============================================================
// 搜索
// ============================================================
searchInput.addEventListener('input', () => renderVideoList(searchInput.value.trim()));

// ============================================================
// 文件导入 / 导出
// ============================================================
$('importCsv').addEventListener('change', (e) => { if (e.target.files[0]) handleCSVImport(e.target.files[0]); });
$('importCsvEmpty').addEventListener('change', (e) => { if (e.target.files[0]) handleCSVImport(e.target.files[0]); });
exportCsvBtn.addEventListener('click', exportCSV);

// ============================================================
// Toast
// ============================================================
function showToast(message, type = 'info') {
  const colors = { success: 'bg-green-500', error: 'bg-red-500', info: 'bg-blue-500' };
  const toast = document.createElement('div');
  toast.className = `toast ${colors[type] || colors.info} text-white px-4 py-2 rounded-lg shadow-lg text-xs max-w-xs`;
  toast.textContent = message;
  toastContainer.appendChild(toast);
  setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 2500);
}

// ============================================================
// 初始化
// ============================================================
renderManualForm();
</script>
</body>
</html>
